name: Publish

# Publishes to npm when a GitHub release is published. The release tag must be
# v<version> of package.json. npm trusts this workflow (trusted publishing,
# configured in the package's settings on npmjs.com for publish.yml), so no
# token is needed; id-token: write lets npm verify the run. npm adds
# provenance by itself when the repository is public.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

      - run: npm ci

      # Unit tests and the allow-listed TCK scenarios on SQLite, PostgreSQL, and MySQL.
      - run: npm run db:up
      - run: npm test

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm publish --access public

      - if: always()
        run: npm run db:down
