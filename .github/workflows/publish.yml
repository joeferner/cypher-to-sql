name: Publish

# Stages a release on npm when a GitHub release is published (or when run by
# hand for an existing tag): the version is uploaded but not public until a
# maintainer approves it on npmjs.com with 2FA (npm stage approve). The tag
# must be v<version> of package.json. npm trusts this workflow (trusted
# publishing, configured in the package's settings on npmjs.com for
# publish.yml), so no token is needed; id-token: write lets npm verify the run.
# npm adds provenance by itself when the repository is public.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to stage, for example v1.1.0
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${TAG}"

      - run: npm ci

      # Unit tests and the allow-listed TCK scenarios on SQLite, PostgreSQL, and MySQL.
      - run: npm run db:up
      - run: npm test

      # Trusted publishing needs npm 11.5.1 or later, staged publishing a recent npm.
      - run: npm install -g npm@latest
      - run: npm stage publish --access public

      - if: always()
        run: npm run db:down
